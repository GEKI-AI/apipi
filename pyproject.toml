[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apipi"
dynamic = ["version"]
description = "HTTP API for hosted agents"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "GEKI FlexCo" },
]
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/GEKI-AI/apipi"
Repository = "https://github.com/GEKI-AI/apipi"
Issues = "https://github.com/GEKI-AI/apipi/issues"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.16,<1",
    "ty>=0.0.80",
]

[tool.hatch.version]
path = "src/apipi/__init__.py"

[project.scripts]
apipi = "apipi.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["apipi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
