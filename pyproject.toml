[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apipi"
dynamic = ["version"]
description = "ApiPi is a drop-in OpenAI Agents API. Point official clients at this gateway and bring your own model URL."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "GEKI FlexCo" },
]
keywords = ["openai", "agents", "gateway", "pi", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2"]

[project.urls]
Homepage = "https://github.com/GEKI-AI/apipi"
Documentation = "https://geki-ai.github.io/apipi/"
Repository = "https://github.com/GEKI-AI/apipi"
Issues = "https://github.com/GEKI-AI/apipi/issues"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "boto3>=1.35,<2",
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.16,<1",
    "ty>=0.0.80",
]

[tool.hatch.version]
path = "src/apipi/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
"src/apipi/pi/guest.sh" = "apipi/pi/guest.sh"

[project.scripts]
apipi = "apipi.cli:main"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["apipi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: fast end-to-end tests; run in GitHub CI",
    "slow: large local validation; not GitHub CI",
    "microvm: live Firecracker guest; needs KVM, images, TAP",
]
