services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apipi
      POSTGRES_PASSWORD: apipi
      POSTGRES_DB: apipi
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apipi -d apipi"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://apipi:apipi@postgres:5432/apipi
      APIPI_API_ONLY: "true"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      APIPI_WORKER_TOKEN: ${APIPI_WORKER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - apipi migrate && apipi serve --api-only --host 0.0.0.0 --port 8000

volumes:
  postgres:
