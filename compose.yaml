services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apipi
      POSTGRES_PASSWORD: apipi
      POSTGRES_DB: apipi
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apipi -d apipi"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres:
