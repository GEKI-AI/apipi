database_url = "postgresql+asyncpg://apipi:apipi@localhost:5432/apipi"
host = "0.0.0.0"
port = 8000
log_level = "info"
log_format = "json"
idle_ttl = "15m"
workspace_ttl = "1h"
max_sessions = 32
max_sessions_per_tenant = 32
turn_timeout = "10m"
auth_cache_ttl = "30s"
max_request_bytes = "1MiB"
max_workspace_bytes = "1GiB"
max_artifact_bytes = "512MiB"
db_pool_size = 5
usage_store = "turns"
usage_retention = "15d"
metrics = false
forward_models = true

[pi]
command = "pi"
auto_compact = true

[sandbox]
backend = "none"

[sandbox.resources]
mem_mib = 512
vcpus = 1

[sandbox.network]
egress_allowlist = true
egress_hosts = []
egress_mbit = 50
