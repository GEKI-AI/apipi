site_name: ApiPi
site_description: Open-source agent platform. Pi is the harness. Isolated environments, your LLM endpoints, OpenAI Agents API–compatible HTTP.
site_author: GEKI FlexCo
copyright: Copyright &copy; 2026 GEKI FlexCo
repo_url: https://github.com/GEKI-AI/apipi
repo_name: GEKI-AI/apipi

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/pi.svg
  favicon: assets/pi.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

watch:
  - docs
  - AGENTS.md
  - CONTRIBUTING.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
      restrict_base_path: false

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Configuration: config.md
      - Run modes: run-modes.md
      - Production: production.md
      - Multiple nodes: scale.md
      - Using the API: using.md
  - Concepts:
      - Agents, sessions, and storage: concepts.md
  - Reference:
      - API: api.md
      - Auth: auth.md
      - Environments: environments.md
      - Tools and skills: tools.md
      - Usage: usage.md
      - How it works: architecture.md
  - Contribute:
      - Contributing: contributing.md
      - How we work: process.md
      - Tests: tests.md
      - Agent rules: agents.md
