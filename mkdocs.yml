site_name: ApiPi
site_description: ApiPi is a drop-in OpenAI Agents API. Point official clients at this gateway and bring your own model URL.
site_author: GEKI FlexCo
copyright: Copyright &copy; 2026 GEKI FlexCo
repo_url: https://github.com/GEKI-AI/apipi
repo_name: GEKI-AI/apipi

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/pi.svg
  favicon: assets/pi.svg
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

watch:
  - docs
  - CONSTITUTION.md
  - AGENTS.md
  - CONTRIBUTING.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
      restrict_base_path: false

nav:
  - Home: index.md
  - Install: install.md
  - Run modes: run-modes.md
  - Configuration: config.md
  - Quickstart: quickstart.md
  - API: api.md
  - Auth: auth.md
  - Environments: environments.md
  - Tools and skills: tools.md
  - Usage: usage.md
  - Architecture: architecture.md
  - Contribute:
      - How we work: process.md
      - Contributing: contributing.md
      - Constitution: constitution.md
      - Agent rules: agents.md
      - Roadmap: roadmap.md
      - Decisions:
          - Index: decisions/index.md
          - "0001 Python": decisions/0001-python-fastapi.md
          - "0002 Pi harness": decisions/0002-pi-harness.md
          - "0003 Postgres": decisions/0003-postgres.md
          - "0004 One Pi per session": decisions/0004-one-pi-per-session.md
          - "0005 API is the focus": decisions/0005-api-is-the-focus.md
          - "0006 Tools, MCP, skills": decisions/0006-tools-mcp-skills.md
          - "0007 Run modes": decisions/0007-run-modes.md
          - "0008 Usage": decisions/0008-usage-observability.md
          - "0009 Pluggable auth": decisions/0009-pluggable-auth.md
