name: Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag for the image assets
        required: false
        default: images-manual
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: Sync
        run: uv sync --locked
      - name: Build default
        run: uv run apipi images build default --out image-out --arch ${{ matrix.arch }}
      - name: Build browser
        run: uv run apipi images build browser --out image-out --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: image-out/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: image-in
          merge-multiple: true
      - name: Publish a local store
        run: uv run apipi images publish --from "$GITHUB_WORKSPACE/image-in" --to "file://$GITHUB_WORKSPACE/image-store"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: image-store/*
          make_latest: false
