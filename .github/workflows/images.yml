name: Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to fill, such as 0.12.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs xz-utils
      - name: Sync
        run: uv sync --locked
      - name: Build default
        run: uv run apipi images build default --out image-out --arch ${{ matrix.arch }}
      - name: Build browser
        if: matrix.arch == 'x86_64'
        run: uv run apipi images build browser --out image-out --arch ${{ matrix.arch }}
      - name: Build work
        run: uv run apipi images build work --out image-out --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: image-out/*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync
        run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: image-in
          merge-multiple: true
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse an existing store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.value }}"
          names=$(gh release view "$tag" --json assets --jq '.assets[].name' || true)
          if printf '%s\n' "$names" | grep -qx index.json; then
            echo "release $tag already has index.json" >&2
            exit 1
          fi
      - name: Publish a versioned store
        run: |
          uv run apipi images publish \
            --from "$GITHUB_WORKSPACE/image-in" \
            --to "file://$GITHUB_WORKSPACE/image-store" \
            --store-version "${{ steps.version.outputs.value }}"
      - name: Sign checksums
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: image-store/v${{ steps.version.outputs.value }}/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: image-store/v${{ steps.version.outputs.value }}/*
          make_latest: false
